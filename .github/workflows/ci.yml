name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  controles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les outils de controle
        run: python -m pip install --upgrade ruff

      # Le noyau doit rester importable sans torch, sans CUDA et sans
      # LichtFeld Studio : c'est ce qui rend cette CI possible.
      - name: Tests unitaires
        run: python -m unittest discover -s tests -t . -v

      - name: Coherence des numeros de version
        run: python scripts/bump_version.py --check

      - name: Analyse statique
        run: ruff check .

      - name: Format
        run: ruff format --check .
